version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: owemate-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: owemate
    ports:
      - '5432:5432'
    volumes:
      - owemate_pgdata:/var/lib/postgresql/data

volumes:
  owemate_pgdata:
    driver: local
